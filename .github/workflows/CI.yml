name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# Nowy commit w tym samym PR anuluje poprzedni, jeszcze trwający przebieg
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

# Minimalne uprawnienia: workflow tylko czyta repozytorium
permissions:
  contents: read

jobs:
  build-and-test:
    name: build-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Pobranie kodu
        uses: actions/checkout@v4

      - name: Instalacja .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.401

      - name: Restore
        run: dotnet restore TurniejePro.slnx

      - name: Build
        run: dotnet build TurniejePro.slnx --configuration Release --no-restore

      - name: Testy xUnit
        run: >
          dotnet test TurniejePro.slnx
          --configuration Release
          --no-build
          --logger "trx;LogFileName=test-results.trx"
          --results-directory ./TestResults

      - name: Zapis wyników testów
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults/**/*.trx
          if-no-files-found: ignore
